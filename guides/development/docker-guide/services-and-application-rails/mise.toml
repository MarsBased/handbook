# Docker tasks for the services + application setup. Rails runs in a container, so
# there are no runtimes to pin here: every command goes through docker compose.
# See the meta tools guide for task conventions.

[tasks.setup]
description = "Fresh clone to running stack: images, Minio bucket, gems, packages, database"
run = """
set -e
docker compose -f .dockerdev/compose.yml build
docker compose -f .dockerdev/compose.yml run --rm --entrypoint='/bin/sh -c /scripts/setup-minio.sh' minio-client
docker compose -f .dockerdev/compose.yml run --rm rails bin/setup
"""

[tasks.dev]
description = "Rails, webpacker and Sidekiq in containers, one dekit task each"
raw = true
run = "dekit"

# `run --rm --service-ports` instead of `up`: the container gets the terminal, so
# byebug and pry breakpoints are interactive inside the dekit task.
[tasks."dev:rails"]
raw = true
run = "docker compose -f .dockerdev/compose.yml run --rm --service-ports rails"

[tasks."dev:webpacker"]
raw = true
run = "docker compose -f .dockerdev/compose.yml run --rm --service-ports webpacker"

[tasks."dev:jobs"]
raw = true
run = "docker compose -f .dockerdev/compose.yml run --rm jobs"

[tasks."docker:run"]
description = "Run a command in the application container, e.g. `mise run docker:run bin/rails db:migrate`"
raw = true
run = "docker compose -f .dockerdev/compose.yml run --rm runner"

[tasks."docker:down"]
description = "Stop and remove every container; the data in .dockerdev/volumes stays"
run = "docker compose -f .dockerdev/compose.yml down"

[tasks."docker:localhost-alias"]
description = "macOS only, once per machine: alias 172.17.0.1 to localhost so Minio has one URL"
run = """
set -e
sudo cp .dockerdev/com.user.docker-host-alias.plist /Library/LaunchDaemons/
sudo chmod 0644 /Library/LaunchDaemons/com.user.docker-host-alias.plist
sudo chown root:wheel /Library/LaunchDaemons/com.user.docker-host-alias.plist
sudo launchctl load /Library/LaunchDaemons/com.user.docker-host-alias.plist
"""
