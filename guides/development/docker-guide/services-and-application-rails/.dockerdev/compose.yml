name: <application-name>-dev

x-app: &app
  build:
    context: .
    dockerfile: ./Dockerfile
    args:
      BUNDLER_VERSION: '<bundler-version>'
  image: <application-name>-dev
  tmpfs:
    - /tmp

x-backend: &backend
  <<: *app
  stdin_open: true
  tty: true
  environment: &backend-env
    NODE_ENV: ${NODE_ENV:-development}
    RAILS_ENV: ${RAILS_ENV:-development}
    REDIS_URL: redis://redis:6379/
    REDIS_HOST: redis
    REDIS_POST: 6379
    DATABASE_URL: postgres://postgres:postgres@postgres:5432
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres
    SELENIUM_URL: http://selenium:4444/wd/hub
    TEST_APP_HOST: 'http://test'
    TEST_APP_PORT: 8200

    # Misc
    BOOTSNAP_CACHE_DIR: /bundle/bootsnap
    WEB_CONCURRENCY: 1
    HISTFILE: /app/log/.bash_history
    EDITOR: vi
  volumes:
    - ../:/app:cached
    - rails_cache:/app/tmp/cache
    - bundle:/bundle
    - node_modules:/app/node_modules
    - ./.psqlrc:/root/.psqlrc:ro
    - ./.pryrc:/root/.pryrc:ro
  depends_on:
    - postgres
    - redis
    - selenium

services:
  rails:
    <<: *backend
    command: bundle exec rails server -b 0.0.0.0
    ports:
      - 3000:3000

  runner:
    <<: *backend
    command: /bin/bash
    environment:
      <<: *backend-env
      HOST: http://rails:3000
      DOMAIN: http://localhost:3000

  jobs:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      <<: *backend-env
      HOST: http://rails:3000

  postgres:
    image: postgres:<postgres-version>
    volumes:
      - ./.psqlrc:/root/.psqlrc:ro
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./log:/root/log:cached
    environment:
      ALLOW_IP_RANGE: 0.0.0.0/0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <application-name>_development
      PSQL_HISTFILE: /root/log/.psql_history
    ports:
      - 5432

  redis:
    image: redis:<redis-version>-alpine
    volumes:
      - redis:/data
    ports:
      - 6379

  # Useful to not depend on your computer chrome version
  selenium:
    image: selenium/standalone-chrome-debug
    logging:
      driver: none
    volumes:
      - ..:/app:cached
    ports:
      - 5900:5900
      - 4444

volumes:
  redis:
  bundle:
  node_modules:
  rails_cache:
