# Tasks for `mise run dev`. Each one runs its mise task, which runs the process in
# its own container. PostgreSQL, Redis, Minio and Selenium start with them through
# depends_on in compose.yml; `mise run docker:down` stops those too.
tasks:
  rails:
    cmd: mise run dev:rails
    autostart: true
  webpacker:
    cmd: mise run dev:webpacker
    autostart: true
  # Only needed for background jobs, such as sending emails: start it with `s`.
  jobs:
    cmd: mise run dev:jobs
