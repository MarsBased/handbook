# Containers and volumes are named after the project, not after the .dockerdev directory.
name: <application-name>-dev

services:
  postgres:
    image: postgres:<postgres-version>
    volumes:
      - ./.psqlrc:/root/.psqlrc:ro
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./log:/root/log:cached
    environment:
      ALLOW_IP_RANGE: 0.0.0.0/0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <database-name>
      PSQL_HISTFILE: /root/log/.psql_history
    # Fixed host ports: the application runs on the host and connects to localhost.
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:<redis-version>-alpine
    volumes:
      - redis:/data
    ports:
      - 6379:6379

  minio:
    image: minio/minio
    volumes:
      - ./volumes/minio:/data
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: 2NVQWHvTT73XMgqapGchy6yAtwHezMZn
    ports:
      - 9000:9000
    command: server /data

  minio-client:
    image: minio/mc
    command: /bin/sh
    entrypoint: /bin/sh
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - minio

volumes:
  redis:
